name: Truvial CI/CD Pipeline

on:
  push:
    branches: [ main, arbitrum-stylus ]
  pull_request:
    branches: [ main ]

jobs:
  smart-contracts:
    name: Build & Check Arbitrum Stylus Contracts
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Rust Toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        targets: wasm32-unknown-unknown

    - name: Rust Cache
      uses: swatinem/rust-cache@v2

    - name: Type-Check Stylus Contracts
      run: cargo check --target wasm32-unknown-unknown

    - name: Compile Stylus WASM Contracts
      run: cargo build --target wasm32-unknown-unknown --release

  frontend:
    name: Build & Test Next.js Frontend
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm install --legacy-peer-deps

    - name: Run Vitest Suite
      run: |
        cd frontend
        npm test

    - name: Build Next.js Application
      run: |
        cd frontend
        npm run build
