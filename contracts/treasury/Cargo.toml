[package]
name = "truvial-treasury"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
stylus-sdk = "0.6.0"
alloy-primitives = { version = "=0.7.6", default-features = false, features = ["tiny-keccak"] }
alloy-sol-types = "=0.7.6"

[build-dependencies]
alloy-primitives = { version = "=0.7.6", features = ["tiny-keccak"] }

[features]
default = []
export-abi = ["stylus-sdk/export-abi"]



